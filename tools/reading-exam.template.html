<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--fs:17px;--bg:#fff;--panel:#fff;--ink:#1a1a1a;--muted:#5b5b5b;--line:#d6d6d6;--soft:#f1f1f1;--hover:#f4f8ff;--red:#d0021b;--green:#2e7d32;--bad:#c62828;--blue:#1d6fd6;--btn:#111;--btnink:#fff;--hl:#ffe86b;--keybg:#e8f6ea;--wrongbg:#fdeaea}
body.dark{--bg:#14161a;--panel:#1d2026;--ink:#e6e8eb;--muted:#9aa0a8;--line:#3a3f47;--soft:#23272e;--hover:#232a36;--red:#ff6b7a;--green:#6fcf7a;--bad:#ff7b7b;--blue:#6ab0ff;--btn:#e6e8eb;--btnink:#14161a;--hl:#8a7400;--keybg:#1f3a24;--wrongbg:#432326}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:var(--fs);line-height:1.6;color:var(--ink);background:var(--bg);overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}[hidden]{display:none!important}
/* ---- top bar ---- */
.xt{position:relative;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.xt .xl,.xt .xr{display:flex;align-items:center;gap:8px;min-width:0}
.xtitle{font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px;padding:4px 18px;border-radius:10px}
.timer.warn{color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.xb{height:38px;min-width:38px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px}
.xb:hover{background:var(--soft)}.xb:disabled{opacity:.35;cursor:default}
.xb svg{width:20px;height:20px}
.saved{font-size:13px;color:var(--muted);min-width:46px;text-align:right}
/* ---- stage ---- */
#stage{position:relative;flex:1;min-height:0}
.part{position:absolute;inset:0;display:flex;flex-direction:column}
.banner{background:var(--soft);padding:10px 28px;line-height:1.4;border-bottom:1px solid var(--line)}.banner p{margin:0}
.ws{flex:1;display:flex;min-height:0;position:relative}
.pane{overflow-y:auto;min-width:0}
.pane.left{width:50%;padding:26px 44px 60px}
.pane.right{flex:1;padding:26px 48px 90px 40px}
.divider{width:14px;flex:0 0 14px;position:relative;cursor:col-resize;background:linear-gradient(var(--line),var(--line)) center/2px 100% no-repeat}
.divider span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:52px;border:1px solid var(--line);background:var(--panel);border-radius:6px;display:grid;place-items:center;font-size:18px;user-select:none}
.pane.left h2{text-align:center;font-size:1.5em;line-height:1.3;margin:0 0 18px}.pane.left p{margin:0 0 1.1em}
.letter{font-weight:800;margin-right:8px}
mark.hl{background:var(--hl);color:inherit;cursor:pointer;border-radius:2px}
.question-group{margin-bottom:38px}.question-group h3{font-size:1.12em;margin:0 0 12px}
.instruction{margin:0 0 8px}.question-group>p{margin:0 0 8px}
.people-legend{border:1px solid var(--line);padding:12px 16px;margin:12px 0;border-radius:4px}
.people-legend div{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:6px}.people-legend b{margin-right:8px}
.matching-grid-wrap{overflow-x:auto;margin-top:16px}
.matching-grid{border-collapse:collapse;width:100%;min-width:520px}
.matching-grid th,.matching-grid td{border:1px solid var(--line);text-align:center;vertical-align:middle}
.matching-grid thead th{background:var(--soft);padding:14px 8px;font-weight:700}.matching-grid thead th:first-child{text-align:left;padding-left:16px}
.mg-stmt{text-align:left!important;padding:14px 16px;line-height:1.5;min-width:230px}.mg-stmt strong{margin-right:6px}
.mg-cell{width:46px;padding:0;position:relative}.mg-cell label{display:flex;width:100%;min-height:60px;align-items:center;justify-content:center;cursor:pointer}
.mg-cell label:hover{background:var(--hover)}.mg-cell input{position:absolute;opacity:0;pointer-events:none}
.mg-cell .tick{width:22px;height:22px;border-radius:50%;border:2px solid transparent}
.mg-cell input:checked+.tick{border-color:var(--ink);background:radial-gradient(var(--ink) 45%,transparent 50%)}
.mg-cell input:focus-visible+.tick{outline:2px solid var(--blue);outline-offset:3px}
.mg-bm{width:44px}.bm{background:none;border:0;padding:4px;color:var(--muted);vertical-align:middle}.bm:hover{color:var(--ink)}.bm.on{color:var(--red)}.bm.on svg{fill:var(--red)}
.question{margin:0 0 26px}.q-head{display:flex;gap:10px;align-items:flex-start}.q-number{font-weight:800;min-width:28px}.q-prompt{flex:1}
.options{margin:10px 0 0 38px;display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:6px 10px;border-radius:4px;cursor:pointer}.opt:hover{background:var(--hover)}
.opt input{margin-top:6px;width:17px;height:17px;accent-color:var(--ink);flex:0 0 auto}.opt b{margin-right:6px}
.summary-card{border:1px solid var(--line);padding:18px 20px;border-radius:4px;line-height:2.3}.summary-card p{margin:0}
.inline-answer{white-space:nowrap}.inline-answer>strong{margin-right:4px}
.answer-input{border:1px solid var(--muted);border-radius:3px;padding:2px 8px;width:170px;height:34px;font-size:.95em;background:var(--panel);color:var(--ink)}
.answer-input:focus{outline:2px solid var(--blue);border-color:var(--blue)}.answer-input.over{border-color:var(--bad)}
.qitem.cur>.q-head .q-number,.qitem.cur>.mg-stmt strong,.inline-answer.cur>strong{color:var(--blue)}
.fb{display:none;font-size:.85em;font-weight:700;margin-left:8px;white-space:normal}.reviewing .fb{display:inline}.fb.good{color:var(--green)}.fb.bad{color:var(--bad)}
.reviewing .answer-input.good{border-color:var(--green)}.reviewing .answer-input.bad{border-color:var(--bad)}
.reviewing .mg-cell.key,.reviewing .opt.key{background:var(--keybg)}.reviewing .mg-cell.wrong,.reviewing .opt.wrong{background:var(--wrongbg)}
/* ---- footer ---- */
.foot{flex:0 0 auto;min-height:72px;border-top:1px solid var(--line);display:flex;align-items:center;padding:8px 22px;gap:14px;background:var(--panel)}
.parts{display:flex;align-items:center;gap:10px;flex:1;min-width:0;flex-wrap:wrap}
.pgrp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
button.pgrp:hover{background:var(--soft)}
.pgrp.on{border-color:var(--ink);flex-wrap:wrap}
.pl{font-weight:800;font-size:1.05em}.pc{font-size:.85em;color:var(--muted)}
.nav{display:flex;gap:3px;flex-wrap:wrap}
.nav button{min-width:36px;height:36px;border:2px solid transparent;background:none;border-radius:3px;font-size:.98em;position:relative}
.nav button:hover{background:var(--soft)}.nav button.ans{text-decoration:underline;text-underline-offset:5px;font-weight:700}
.nav button.on{border-color:var(--ink);font-weight:800}
.nav button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.nav button.good{color:var(--green);font-weight:800}.nav button.bad{color:var(--bad);font-weight:800}
.count{color:var(--muted);font-size:.9em;white-space:nowrap}
.arw{width:54px;height:44px;border:0;border-radius:6px;background:var(--btn);color:var(--btnink);font-size:22px;display:grid;place-items:center}.arw:disabled{opacity:.3;cursor:default}
.submit{background:var(--btn);color:var(--btnink);border:0;border-radius:6px;padding:11px 30px;font-weight:700;font-size:1.02em}
/* ---- popups ---- */
.hlpop{position:fixed;z-index:60;background:#111;color:#fff;border-radius:6px;display:flex;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.hlpop button{background:none;border:0;color:#fff;padding:8px 14px;font-size:14px;font-weight:600}.hlpop button:hover{background:#333}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--panel);color:var(--ink);border-radius:10px;width:100%;max-width:900px;padding:32px 40px 36px;text-align:center}
.modal.small{max-width:460px;margin-top:12vh}
.modal h2{color:var(--red);font-size:28px;margin:0 0 18px}.modal.small h2{color:var(--ink);font-size:22px}
.scorebox{display:inline-flex;gap:30px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:16px 34px;flex-wrap:wrap;justify-content:center}
.scorebox small{display:block;font-size:15px;color:var(--muted)}.scorebox strong{display:block;font-size:42px;line-height:1.15;color:var(--red)}.scorebox strong.pass{color:var(--green)}
.partscores{margin:12px 0 0;color:var(--muted);font-size:.95em}
.modal h3{text-align:left;margin:26px 0 10px;font-size:18px}
.rt-wrap{overflow-x:auto}.rt{width:100%;border-collapse:collapse;text-align:left;font-size:.95em}
.rt th{background:var(--soft);font-weight:700}.rt th,.rt td{border:1px solid var(--line);padding:6px 10px}.rt .y{color:var(--green);font-weight:800}.rt .n{color:var(--bad);font-weight:800}
.mbtns{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--btnink);border:1px solid var(--btn);border-radius:6px;padding:12px 26px;font-weight:700}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
@media (max-width:1500px){.count{display:none}}
@media (max-width:860px){
  .xt{padding:0 8px;flex-basis:52px;gap:6px}.xtitle,.saved{display:none}.timer{font-size:21px;padding:2px 6px}.xb{padding:0 9px;height:36px;min-width:36px}.xb .lbl{display:none}.xt .xr{gap:5px}
  .ws{flex-direction:column}.pane.left{width:100%!important;height:42%;padding:14px 14px 22px;border-bottom:2px solid var(--line)}.pane.right{padding:14px 14px 40px}.divider{display:none}
  .banner{padding:6px 14px;font-size:.92em}
  .foot{padding:6px 8px;gap:6px;flex-wrap:wrap;min-height:0}
  .parts{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .pgrp{flex:0 0 auto;flex-wrap:nowrap;padding:4px 8px}.pc{display:none}.pl{font-size:.95em;white-space:nowrap}
  .nav{flex-wrap:nowrap}.nav button{min-width:34px;height:34px}
  .arw{width:48px;height:38px;font-size:20px}.submit{padding:8px 22px;margin-left:auto}
  .options{margin-left:0}.answer-input{width:130px}.modal{padding:20px 12px}
}
</style>
</head>
<body>
<header class="xt">
  <div class="xl"><button class="xb" id="exitBtn" title="Leave the exam (your answers stay saved)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span class="lbl">Exit</span></button><span class="xtitle">__HEADTITLE__</span></div>
  <div class="timer" id="timer" role="timer" aria-live="off">--:--</div>
  <div class="xr"><span class="saved" id="saved"></span>
    <button class="xb" id="themeBtn" aria-label="Day or night mode" title="Day / night mode"></button>
    <button class="xb" id="fsDn" aria-label="Smaller text" title="Smaller text">A&minus;</button>
    <button class="xb" id="fsUp" aria-label="Bigger text" title="Bigger text">A+</button>
  </div>
</header>
<main id="stage">
__PARTS__
</main>
<footer class="foot">
  <div class="parts" id="parts"></div>
  <span class="count" id="count"></span>
  <button class="arw" id="prevBtn" aria-label="Previous question">&#8592;</button><button class="arw" id="nextBtn" aria-label="Next question">&#8594;</button>
  <button class="submit" id="submitBtn">Submit</button>
</footer>
<div class="hlpop" id="hlpop" hidden><button id="hlDo">Highlight</button><button id="hlClear" hidden>Clear</button></div>
<div class="ov" id="confirmOv" hidden><div class="modal small"><h2 id="confirmH">Submit your answers?</h2><p id="confirmTxt"></p><div class="mbtns"><button class="btn ghost" id="cancelBtn">Keep working</button><button class="btn" id="okBtn">Submit</button></div></div></div>
<div class="ov" id="resOv" hidden><div class="modal">
  <h2 id="resTitle">Your Results</h2>
  <div class="scorebox"><div><small>Raw score</small><strong id="resScore"></strong></div><div><small>Approx. band</small><strong id="resBand"></strong></div></div>
  <div class="partscores" id="resParts"></div>
  <h3>Your answers</h3><div class="rt-wrap"><table class="rt"><thead><tr><th>#</th><th>Your answer</th><th>Correct answer</th><th></th></tr></thead><tbody id="resBody"></tbody></table></div>
  <div class="mbtns"><button class="btn ghost" id="reviewBtn">Review in the test</button><button class="btn ghost" id="retakeBtn">Retake</button><button class="btn" id="finishBtn">Finish</button></div>
</div></div>
<script>
"use strict";
const CFG=__CFG__;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const P=CFG.parts,KEY={},NUMS=[];P.forEach(p=>{Object.assign(KEY,p.key);for(let n=p.first;n<=p.last;n++)NUMS.push(n)});
const TOTAL=NUMS.length,FS=[15,17,19,21,23];
const partOf=n=>P.find(p=>n>=p.first&&n<=p.last);
let S={answers:{},flags:[],submitted:false,results:{},score:0,fs:17,theme:'light',split:50,endAt:0,part:P[0].part,cur:NUMS[0]};
let timerIv=null;
function load(){try{const r=localStorage.getItem(CFG.store);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(CFG.store,JSON.stringify(S));const el=$('#saved');el.textContent='Saved';clearTimeout(save.t);save.t=setTimeout(()=>el.textContent='',1400)}catch(e){}}
/* ---------- answers ---------- */
function norm(v){return String(v||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function keyText(n){const k=KEY[n],f=x=>/^[A-I]$|^(TRUE|FALSE|NOT GIVEN|YES|NO)$/.test(x)?x:x.toLowerCase();return Array.isArray(k)?k.map(f).join(' / '):f(k)}
function isCorrect(n,a){if(!a)return false;const k=KEY[n];return(Array.isArray(k)?k:[k]).some(x=>norm(x)===norm(a))}
function getAns(n){const t=document.getElementById('q'+n);if(t&&t.type==='text')return t.value.trim();const r=$(`input[name="q${n}"]:checked`);return r?r.value:''}
function item(n){return $(`.qitem[data-q="${n}"]`)}
const cssEsc=v=>(window.CSS&&CSS.escape)?CSS.escape(v):String(v).replace(/["\\]/g,'\\$&');
function applyAnswers(){NUMS.forEach(n=>{const v=S.answers[n];if(!v)return;const t=document.getElementById('q'+n);if(t&&t.type==='text')t.value=v;else{const r=$(`input[name="q${n}"][value="${cssEsc(v)}"]`);if(r)r.checked=true}})}
function checkWords(t){const max=+t.dataset.maxwords||0;if(!max)return;const w=t.value.trim()?t.value.trim().split(/\s+/).length:0;t.classList.toggle('over',w>max);t.title=w>max?`Maximum ${max} word${max>1?'s':''}`:''}
/* ---------- view: parts, navigation ---------- */
function showPart(pn){S.part=pn;$$('.part').forEach(el=>el.hidden=(+el.dataset.part!==pn));applySplit();renderFoot()}
function renderFoot(){
  $('#parts').innerHTML=P.map(p=>{
    const nums=[];for(let n=p.first;n<=p.last;n++)nums.push(n);
    const answered=nums.filter(n=>getAns(n)).length;
    if(p.part===S.part)return `<div class="pgrp on"><span class="pl">Part ${p.part}</span><div class="nav">${nums.map(n=>`<button type="button" data-n="${n}" aria-label="Question ${n}" class="${getAns(n)?'ans ':''}${n===S.cur?'on ':''}${S.flags.includes(n)?'flag ':''}${S.submitted&&S.results[n]===true?'good ':''}${S.submitted&&S.results[n]===false?'bad':''}">${n}</button>`).join('')}</div></div>`;
    return `<button type="button" class="pgrp" data-part="${p.part}" aria-label="Go to Part ${p.part}"><span class="pl">Part ${p.part}</span><span class="pc">${answered} of ${nums.length}</span></button>`}).join('');
}
function refresh(){
  const answered=NUMS.filter(n=>getAns(n)).length;
  $('#count').textContent=`${answered} of ${TOTAL} answered`;
  $$('.qitem').forEach(it=>it.classList.toggle('cur',+it.dataset.q===S.cur));
  NUMS.forEach(n=>{const bm=$(`.bm[data-flag="${n}"]`);if(bm)bm.classList.toggle('on',S.flags.includes(n))});
  $('#prevBtn').disabled=S.cur<=NUMS[0];$('#nextBtn').disabled=S.cur>=NUMS[NUMS.length-1];
  $('#submitBtn').textContent=S.submitted?'My result':'Submit';
  renderFoot();
}
function goTo(n,focus=true){
  n=Math.max(NUMS[0],Math.min(NUMS[NUMS.length-1],n));S.cur=n;const p=partOf(n);
  if(p.part!==S.part)showPart(p.part);
  refresh();const it=item(n);if(!it)return;it.scrollIntoView({block:'center'});
  if(focus&&!S.submitted){const t=document.getElementById('q'+n);if(t&&t.type==='text')setTimeout(()=>t.focus({preventScroll:true}),150)}
  save();
}
/* ---------- theme + size ---------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14z"/></svg>';
function applyLook(){document.body.classList.toggle('dark',S.theme==='dark');$('#themeBtn').innerHTML=S.theme==='dark'?SUN:MOON;$('#themeBtn').title=S.theme==='dark'?'Switch to day mode':'Switch to night mode';
  document.documentElement.style.setProperty('--fs',S.fs+'px');$('#fsDn').disabled=S.fs<=FS[0];$('#fsUp').disabled=S.fs>=FS[FS.length-1]}
/* ---------- split ---------- */
function applySplit(){const l=$(`.part[data-part="${S.part}"] .pane.left`);if(!l)return;l.style.width=window.innerWidth>860?S.split+'%':''}
(function(){let drag=false,ws=null;
  document.addEventListener('pointerdown',e=>{const d=e.target.closest('.divider');if(!d)return;drag=true;ws=d.closest('.ws');d.setPointerCapture(e.pointerId);document.body.style.userSelect='none'});
  document.addEventListener('pointermove',e=>{if(!drag||!ws)return;const r=ws.getBoundingClientRect();S.split=Math.max(25,Math.min(75,(e.clientX-r.left)/r.width*100));applySplit()});
  document.addEventListener('pointerup',()=>{if(!drag)return;drag=false;document.body.style.userSelect='';save()});
  document.addEventListener('dblclick',e=>{if(e.target.closest('.divider')){S.split=50;applySplit();save()}});
})();
/* ---------- timer ---------- */
function remaining(){return Math.max(0,Math.round((S.endAt-Date.now())/1000))}
function fmt(r){return String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0')}
function tick(){
  const el=$('#timer');if(S.submitted){el.classList.remove('warn');return}
  const r=remaining();el.textContent=fmt(r);el.classList.toggle('warn',r<=300);
  if(r<=0){clearInterval(timerIv);finalize(true)}
}
function startTimer(){clearInterval(timerIv);if(S.submitted){$('#timer').textContent='Finished';return}tick();timerIv=setInterval(tick,1000)}
/* ---------- grading + results ---------- */
function bandOf(s){const t=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]];for(const[m,b]of t)if(s>=m)return b;return 'below 2.5'}
function grade(){let score=0;S.results={};NUMS.forEach(n=>{const a=getAns(n);S.answers[n]=a;const g=isCorrect(n,a);S.results[n]=g;if(g)score++});S.score=score;S.submitted=true;save()}
function paintReview(){
  const on=S.submitted;$$('.pane.right').forEach(p=>p.classList.toggle('reviewing',on));
  $$('.pane.right input').forEach(i=>i.disabled=on);
  $$('.mg-cell,.opt').forEach(e=>e.classList.remove('key','wrong'));$$('.answer-input').forEach(e=>e.classList.remove('good','bad'));
  if(!on){$$('.fb').forEach(f=>{f.textContent='';f.className='fb'});return}
  NUMS.forEach(n=>{const ok=S.results[n],fb=$(`.fb[data-fb="${n}"]`);
    if(fb){fb.className='fb '+(ok?'good':'bad');fb.textContent=ok?'✔':`✘ Answer: ${keyText(n)}`}
    const t=document.getElementById('q'+n);if(t&&t.type==='text'){t.classList.add(ok?'good':'bad');return}
    const k=Array.isArray(KEY[n])?KEY[n][0]:KEY[n];
    $$(`input[name="q${n}"]`).forEach(r=>{const box=r.closest('.mg-cell')||r.closest('.opt');if(!box)return;if(r.value===k)box.classList.add('key');else if(r.checked)box.classList.add('wrong')})});
}
function showResults(auto){
  const e=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  $('#resTitle').textContent=auto?'Time is up — your results':'Your Results';
  const sc=$('#resScore');sc.textContent=`${S.score} / ${TOTAL}`;sc.classList.toggle('pass',S.score/TOTAL>=.6);$('#resBand').textContent=bandOf(S.score);
  $('#resParts').textContent=P.map(p=>{let s=0,t=0;for(let n=p.first;n<=p.last;n++){t++;if(S.results[n])s++}return `Part ${p.part}: ${s}/${t}`}).join('   ·   ')+'   ·   The band is an estimate from the Academic Reading conversion table.';
  $('#resBody').innerHTML=NUMS.map(n=>{const u=S.answers[n]||'',ok=S.results[n];return `<tr><td>${n}</td><td>${u?e(u):'—'}</td><td>${e(keyText(n))}</td><td class="${ok?'y':'n'}">${ok?'✔':'✘'}</td></tr>`}).join('');
  $('#resOv').hidden=false;
}
function finalize(auto){if(S.submitted){showResults(false);return}grade();clearInterval(timerIv);$('#timer').textContent='Finished';$('#timer').classList.remove('warn');paintReview();refresh();showResults(auto)}
function askSubmit(){
  if(S.submitted){showResults(false);return}
  const un=NUMS.filter(n=>!getAns(n)).length;
  $('#confirmH').textContent='Submit your answers?';$('#okBtn').textContent='Submit';$('#cancelBtn').textContent='Keep working';
  $('#confirmTxt').textContent=(un?`You have ${un} unanswered question${un>1?'s':''}. `:'You have answered every question. ')+`Time left: ${fmt(remaining())}. You cannot change your answers after submitting.`;
  $('#confirmOv').hidden=false;$('#okBtn').onclick=()=>{$('#confirmOv').hidden=true;finalize(false)};
}
function askExit(){
  $('#confirmH').textContent='Leave the exam?';$('#okBtn').textContent='Leave';$('#cancelBtn').textContent='Stay';
  $('#confirmTxt').textContent=S.submitted?'Your result is saved.':'Your answers are saved, but the clock keeps running.';
  $('#confirmOv').hidden=false;$('#okBtn').onclick=()=>{$('#confirmOv').hidden=true;exitExam()};
}
function exitExam(){try{parent.postMessage({type:'exam-exit',submitted:S.submitted},'*')}catch(e){}}
function retake(){
  S.answers={};S.flags=[];S.submitted=false;S.results={};S.score=0;S.endAt=Date.now()+CFG.minutes*60000;S.cur=NUMS[0];save();
  $$('.pane.right input[type=text]').forEach(i=>{i.value='';i.classList.remove('over')});$$('.pane.right input[type=radio]').forEach(i=>i.checked=false);
  $$('mark.hl').forEach(unwrap);paintReview();$('#resOv').hidden=true;showPart(P[0].part);refresh();startTimer();
}
/* ---------- highlighting: passage AND questions ---------- */
let hlRange=null,hlMark=null;
function unwrap(m){const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);p.normalize()}
function wrapRange(range,root){
  const sc=range.startContainer,so=range.startOffset,ec=range.endContainer,eo=range.endOffset,w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
  while(w.nextNode()){const n=w.currentNode;if(range.intersectsNode(n)&&n.nodeValue.length&&!n.parentNode.closest('.fb,script,style'))nodes.push(n)}
  nodes.forEach(n=>{let s=0,e=n.nodeValue.length;if(n===sc&&sc.nodeType===3)s=so;if(n===ec&&ec.nodeType===3)e=eo;if(s>=e)return;if(n.parentNode.closest('mark.hl'))return;
    let mid=s>0?n.splitText(s):n;if(e-s<mid.nodeValue.length)mid.splitText(e-s);if(!mid.nodeValue.trim())return;
    const m=document.createElement('mark');m.className='hl';mid.parentNode.insertBefore(m,mid);m.appendChild(mid)});
}
function popAt(x,y,mode){const p=$('#hlpop');$('#hlDo').hidden=mode!=='add';$('#hlClear').hidden=mode!=='clear';p.hidden=false;p.style.left=Math.min(window.innerWidth-140,Math.max(8,x-50))+'px';p.style.top=Math.max(8,y-48)+'px'}
function hidePop(){$('#hlpop').hidden=true;hlRange=null;hlMark=null}
function paneOf(node){const el=node.nodeType===1?node:node.parentElement;return el&&el.closest('.pane')}
function rectOf(o,e){try{const b=o.getBoundingClientRect();if(b&&(b.width||b.height||b.top))return b}catch(x){}const t=(e&&e.changedTouches&&e.changedTouches[0])||e||{};return{left:t.clientX||40,top:t.clientY||60,width:0}}
function onSelect(e){
  setTimeout(()=>{
    const ae=document.activeElement;if(ae&&ae.tagName==='INPUT'&&ae.type==='text'&&ae.selectionStart!==ae.selectionEnd)return;
    const sel=window.getSelection();
    if(sel&&!sel.isCollapsed&&sel.rangeCount){const r=sel.getRangeAt(0),pane=paneOf(r.commonAncestorContainer);
      if(pane){hlRange=r.cloneRange();hlRange._root=pane;const b=rectOf(r,e);popAt(b.left+b.width/2,b.top,'add');return}}
    const m=e.target&&e.target.closest&&e.target.closest('mark.hl');if(m){hlMark=m;const b=rectOf(m,e);popAt(b.left+b.width/2,b.top,'clear');return}
    hidePop()},10);
}
$('#stage').addEventListener('mouseup',onSelect);$('#stage').addEventListener('touchend',onSelect);
$('#stage').addEventListener('click',e=>{const m=e.target.closest('mark.hl');if(m&&m.closest('label'))e.preventDefault()});
$('#hlDo').addEventListener('mousedown',e=>{e.preventDefault();if(hlRange)wrapRange(hlRange,hlRange._root);window.getSelection().removeAllRanges();hidePop()});
$('#hlClear').addEventListener('mousedown',e=>{e.preventDefault();if(hlMark)unwrap(hlMark);hidePop()});
$('#hlDo').addEventListener('touchend',e=>{e.preventDefault();if(hlRange)wrapRange(hlRange,hlRange._root);window.getSelection().removeAllRanges();hidePop()});
document.addEventListener('mousedown',e=>{if(!e.target.closest('#hlpop')&&!e.target.closest('mark.hl'))hidePop()});
$$('.pane').forEach(p=>p.addEventListener('scroll',hidePop,{passive:true}));
/* ---------- events ---------- */
document.addEventListener('input',e=>{const t=e.target;if(!t.closest||!t.closest('.pane.right'))return;if(t.type==='text')checkWords(t);const m=/^q(\d+)$/.exec(t.id||t.name||'');if(m){S.answers[+m[1]]=getAns(+m[1]);save();refresh()}});
document.addEventListener('change',e=>{const t=e.target;const m=t&&/^q(\d+)$/.exec(t.name||'');if(m){S.answers[+m[1]]=getAns(+m[1]);S.cur=+m[1];save();refresh()}});
document.addEventListener('click',e=>{
  const nb=e.target.closest('.nav button');if(nb){goTo(+nb.dataset.n);return}
  const pg=e.target.closest('button.pgrp');if(pg){const p=P.find(x=>x.part===+pg.dataset.part);S.cur=p.first;showPart(p.part);goTo(p.first,false);return}
  const bm=e.target.closest('.bm');if(bm){const n=+bm.dataset.flag,i=S.flags.indexOf(n);if(i>=0)S.flags.splice(i,1);else S.flags.push(n);save();refresh();return}
  const qi=e.target.closest('.qitem');if(qi&&!S.submitted){const n=+qi.dataset.q;if(n!==S.cur){S.cur=n;refresh()}}
});
$('#prevBtn').onclick=()=>goTo(S.cur-1);$('#nextBtn').onclick=()=>goTo(S.cur+1);$('#submitBtn').onclick=askSubmit;
$('#cancelBtn').onclick=()=>{$('#confirmOv').hidden=true};$('#exitBtn').onclick=askExit;
$('#reviewBtn').onclick=()=>{$('#resOv').hidden=true;paintReview()};$('#finishBtn').onclick=()=>{$('#resOv').hidden=true;exitExam()};
$('#retakeBtn').onclick=()=>{if(window.confirm('Clear all answers and start the whole test again with a new 60-minute clock?'))retake()};
$('#themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';applyLook();save()};
$('#fsDn').onclick=()=>{const i=FS.indexOf(S.fs);S.fs=FS[Math.max(0,(i<0?1:i)-1)];applyLook();save()};
$('#fsUp').onclick=()=>{const i=FS.indexOf(S.fs);S.fs=FS[Math.min(FS.length-1,(i<0?1:i)+1)];applyLook();save()};
window.addEventListener('resize',applySplit);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#confirmOv').hidden)$('#confirmOv').hidden=true}});
/* ---------- boot: no start screen, the exam is already running ---------- */
load();if(FS.indexOf(S.fs)<0)S.fs=17;
if(!S.endAt){S.endAt=Date.now()+CFG.minutes*60000;save()}
applyLook();applyAnswers();$$('.answer-input').forEach(checkWords);
if(!P.some(p=>p.part===S.part))S.part=P[0].part;showPart(S.part);paintReview();refresh();
if(S.submitted){$('#timer').textContent='Finished'}else startTimer();
window.__exam={S:()=>S,finalize,goTo,tick,retake};
</script>
</body>
</html>
